<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Саше ❤️</title>

<link href="https://fonts.cdnfonts.com/css/bubbleboddy-neue-trial" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/stpageflip@2.0.7/dist/page-flip.browser.min.js"></script>

<style>
body{
margin:0;
font-family:'Bubbleboddy Neue Trial', sans-serif;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
color:white;
text-align:center;
overflow-x:hidden;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:70px;
}

.cover{
width:280px;
height:400px;
background:#d85b8a;
margin:40px auto;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
cursor:pointer;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

#book{
display:none;
margin:auto;
width:800px;
height:500px;
}

.page{
background:white;
display:flex;
align-items:center;
justify-content:center;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

<div id="book"></div>

<script>
const photos = [
"photo_2026-05-04_10-17-11.jpg",
"photo_2026-05-04_10-17-10.jpg",
"photo_2026-05-04_10-17-09.jpg",
"photo_2026-05-04_10-17-08.jpg"
];

function openBook(){

document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";

const pageFlip = new St.PageFlip(
document.getElementById("book"),
{
width: 400,
height: 500,
showCover: true
}
);

const pages = photos.map(p =>
`<div class="page"><img src="${p}"></div>`
);

pageFlip.loadFromHTML(pages);
}
</script>

</body>
</html>
