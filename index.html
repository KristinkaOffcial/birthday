<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Саше ❤️</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/stpageflip@2.0.7/dist/page-flip.min.css">
<link href="https://fonts.cdnfonts.com/css/bubbleboddy-neue-trial" rel="stylesheet">

<style>
body{
margin:0;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
font-family:'Bubbleboddy Neue Trial',sans-serif;
text-align:center;
color:white;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:80px;
}

.cover{
width:300px;
height:420px;
margin:60px auto;
background:linear-gradient(135deg,#5d1632,#d85b8a);
border-radius:15px;
display:flex;
justify-content:center;
align-items:center;
font-size:50px;
cursor:pointer;
box-shadow:0 30px 60px rgba(0,0,0,0.4);
}

#book{
display:none;
margin:auto;
width:800px;
height:500px;
}

.page{
background:white;
display:flex;
justify-content:center;
align-items:center;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

<div id="book"></div>

<script src="https://cdn.jsdelivr.net/npm/stpageflip@2.0.7/dist/page-flip.browser.min.js"></script>

<script>
const photos = [
"photo_2026-05-04_10-17-11.jpg",
"photo_2026-05-04_10-17-10.jpg",
"photo_2026-05-04_10-17-09.jpg",
"photo_2026-05-04_10-17-08.jpg",
"photo_2026-05-04_10-17-07.jpg",
"photo_2026-05-04_10-17-04.jpg",
"photo_2026-05-04_10-17-02.jpg",
"photo_2026-05-04_10-17-01.jpg",
"photo_2026-05-04_10-17-00.jpg",
"photo_2026-05-04_10-16-59.jpg",
"photo_2026-05-04_10-16-57.jpg",
"photo_2026-05-04_10-16-56.jpg",
"photo_2026-05-04_10-16-55.jpg",
"photo_2026-05-04_10-16-54.jpg",
"photo_2026-05-04_10-16-53.jpg"
];

let pageFlip;

function openBook(){

document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";

pageFlip = new St.PageFlip(document.getElementById("book"), {
width: 400,
height: 500,
showCover: true
});

let pages = [];

photos.forEach(p => {
pages.push(`
<div class="page">
<img src="${p}" onerror="this.src='https://via.placeholder.com/400x500?text=NO+PHOTO'">
</div>
`);
});

pageFlip.loadFromHTML(pages);
}
</script>

</body>
</html>
