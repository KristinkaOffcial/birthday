<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:'Comfortaa',sans-serif;
background:linear-gradient(135deg,#d6ecff,#ffd6f5);
overflow-x:hidden;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}
.title{
font-family:'Baloo 2';
font-size:clamp(42px,8vw,90px);
background:linear-gradient(90deg,#6ec1ff,#ff8ad6);
-webkit-background-clip:text;
color:transparent;
}

/* КНИГА */
.book-wrapper{
perspective:1500px;
text-align:center;
}

.book-cover{
width:340px;
height:460px;
margin:auto;
border-radius:16px;
background:linear-gradient(145deg,#5bbcff,#ff7ed1);
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
position:relative;
box-shadow:0 30px 80px rgba(0,0,0,.25);
transform-style:preserve-3d;
transition:1s;
}

/* корешок */
.book-cover::before{
content:"";
position:absolute;
left:0;
top:0;
width:20px;
height:100%;
background:rgba(0,0,0,.2);
border-radius:16px 0 0 16px;
}

/* отблеск */
.book-cover::after{
content:"";
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(120deg,transparent,rgba(255,255,255,.4),transparent);
animation:shine 3s infinite;
}
@keyframes shine{
100%{left:100%;}
}

.book-cover.open{
transform:rotateY(-100deg);
opacity:0;
}

.lock{
position:absolute;
bottom:20px;
font-size:36px;
}

/* СТРАНИЦЫ */
#book{
display:none;
margin:auto;
filter:drop-shadow(0 20px 40px rgba(0,0,0,.25));
}

.page{
background:#fffdf6;
border-radius:6px;
overflow:hidden;
}

/* рамка фото как полароид */
.frame{
padding:12px;
background:#fff;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.frame img{
width:100%;
height:90%;
object-fit:cover;
border-radius:6px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* кнопки */
.controls{
text-align:center;
margin-top:12px;
}
button{
padding:10px 18px;
border:none;
border-radius:20px;
margin:5px;
cursor:pointer;
background:#ff8ad6;
color:white;
}

/* СЕРДЕЧКИ */
.fall{
position:fixed;
top:-20px;
pointer-events:none;
animation:fall linear infinite;
}
@keyframes fall{
to{transform:translateY(110vh);}
}
</style>

</head>

<body>

<div class="hero">
<div class="title">С днём рождения, Сашулька 💗</div>
</div>

<div class="book-wrapper">

<div class="book-cover" onclick="openBook(this)">
<h2>Наша история 💗</h2>
<div class="lock">🔒</div>
</div>

<div id="book"></div>

<div class="controls">
<button onclick="prev()">←</button>
<button onclick="next()">→</button>
</div>

</div>

<script>

const photos = [
"photo_2026-05-04_10-15-21.jpg",
"photo_2026-05-04_10-15-22.jpg",
"photo_2026-05-04_10-15-23.jpg",
"photo_2026-05-04_10-15-24.jpg",
"photo_2026-05-04_10-15-25.jpg",
"photo_2026-05-04_10-15-26.jpg",
"photo_2026-05-04_10-15-27.jpg",
"photo_2026-05-04_10-15-28.jpg",
"photo_2026-05-04_10-15-29.jpg",
"photo_2026-05-04_10-15-30 (2).jpg",
"photo_2026-05-04_10-15-30.jpg",
"photo_2026-05-04_10-15-31.jpg",
"photo_2026-05-04_10-15-32.jpg",
"photo_2026-05-04_10-15-33.jpg",
"photo_2026-05-04_10-15-35.jpg",
"photo_2026-05-04_10-15-36.jpg",
"photo_2026-05-04_10-15-37.jpg",
"photo_2026-05-04_10-15-38.jpg",
"photo_2026-05-04_10-15-39.jpg",
"photo_2026-05-04_10-15-40.jpg",
"photo_2026-05-04_10-15-42.jpg",
"photo_2026-05-04_10-15-43 (2).jpg",
"photo_2026-05-04_10-15-43.jpg",
"photo_2026-05-04_10-15-44.jpg",
"photo_2026-05-04_10-15-45.jpg"
];

let pageFlip;

function openBook(el){
el.classList.add("open");

setTimeout(()=>{
el.style.display="none";

const book=document.getElementById("book");
book.style.display="block";

photos.forEach(p=>{
const page=document.createElement("div");
page.className="page";

const frame=document.createElement("div");
frame.className="frame";

const img=document.createElement("img");
img.src=p;
img.loading="lazy";

frame.appendChild(img);
page.appendChild(frame);
book.appendChild(page);
});

pageFlip=new St.PageFlip(book,{
width:380,
height:540,
showCover:true,
maxShadowOpacity:0.4,
flippingTime:900
});

pageFlip.loadFromHTML(document.querySelectorAll(".page"));

},700);
}

function next(){ if(pageFlip) pageFlip.flipNext(); }
function prev(){ if(pageFlip) pageFlip.flipPrev(); }

/* лёгкие сердечки */
for(let i=0;i<12;i++){
let el=document.createElement("div");
el.className="fall";
el.innerText="💗";
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(6+Math.random()*6)+"s";
document.body.appendChild(el);
}

</script>

</body>
</html>
