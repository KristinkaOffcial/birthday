<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения 💛</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Comfortaa',sans-serif;
background:linear-gradient(135deg,#fff3b8,#ffd1e8);
}

/* экран */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.title{
font-family:'Baloo 2';
font-size:clamp(40px,8vw,90px);
color:#ffb703;
}

.arrow{
font-size:40px;
animation:down 1.5s infinite;
text-decoration:none;
}

@keyframes down{50%{transform:translateY(10px);}}

/* текст */
.section{
padding:60px 20px;
max-width:900px;
margin:auto;
}

h2{
text-align:center;
font-family:'Baloo 2';
color:#ef9b00;
}

.text{
white-space:pre-line;
line-height:1.9;
}

/* ГАЛЕРЕЯ */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
margin-top:30px;
}

.gallery img{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* МОДАЛКА */
.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.modal img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

.modal.show{
display:flex;
}
</style>

</head>

<body>

<div class="hero">
<div class="title">С днём рождения, Сашулька 💛</div>
<a href="#text" class="arrow">↓</a>
</div>

<div id="text" class="section">
<h2>Поздравление 💛</h2>
<div class="text">
С днём рождения, Саша 💛
Я даже не знаю, с чего начать, потому что ты — это огромная часть моей жизни...
(вставь весь текст как у тебя)
</div>
</div>

<div class="section">
<h2>Наша история 📖</h2>

<div class="gallery" id="gallery"></div>

</div>

<div class="modal" id="modal" onclick="this.classList.remove('show')">
<img id="modalImg">
</div>

<script>

/* ВСТАВЬ ВСЕ ФОТО СЮДА */
const photos = [
/* твой список */
];

const gallery=document.getElementById("gallery");
const modal=document.getElementById("modal");
const modalImg=document.getElementById("modalImg");

photos.forEach(p=>{
const img=document.createElement("img");
img.src=p;
img.loading="lazy";

img.onclick=()=>{
modal.classList.add("show");
modalImg.src=p;
};

gallery.appendChild(img);
});

</script>

</body>
</html>
