<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Саше ❤️</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
text-align:center;
color:white;
}

.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:70px;
}

.cover{
width:260px;
height:360px;
background:#d85b8a;
margin:40px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
border-radius:12px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

.book{
display:none;
margin:30px auto;
width:300px;
height:400px;
background:white;
border-radius:10px;
overflow:hidden;
}

.book img{
width:100%;
height:100%;
object-fit:cover;
}

.buttons{
margin-top:20px;
display:none;
}

button{
padding:10px 20px;
font-size:18px;
margin:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

<div class="book" id="book">
<img id="photo">
</div>

<div class="buttons" id="buttons">
<button onclick="prev()">←</button>
<button onclick="next()">→</button>
</div>

<script>

const photos = [
"photo_2026-05-04_10-17-11.jpg",
"photo_2026-05-04_10-17-10.jpg",
"photo_2026-05-04_10-17-09.jpg",
"photo_2026-05-04_10-17-08.jpg",
"photo_2026-05-04_10-17-07.jpg"
];

let index = 0;

function openBook(){
document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";
document.getElementById("buttons").style.display="block";
show();
}

function show(){
document.getElementById("photo").src = photos[index];
}

function next(){
if(index < photos.length-1){
index++;
show();
}
}

function prev(){
if(index > 0){
index--;
show();
}
}

</script>

</body>
</html>
