<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Саше ❤️</title>

<style>
body{
margin:0;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
font-family:sans-serif;
text-align:center;
color:white;
}

/* экран */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:60px;
}

/* обложка */
.cover{
width:260px;
height:360px;
background:linear-gradient(135deg,#7b2d43,#d85b8a);
margin:30px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:35px;
cursor:pointer;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
transition:.3s;
}

.cover:hover{
transform:scale(1.05);
}

/* книга */
.book{
display:none;
width:300px;
height:400px;
margin:auto;
background:white;
border-radius:10px;
overflow:hidden;
}

.book img{
width:100%;
height:100%;
object-fit:cover;
}

/* кнопки */
.controls{
display:none;
margin-top:20px;
}

button{
padding:10px 20px;
font-size:18px;
margin:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

<div class="book" id="book">
<img id="photo">
</div>

<div class="controls" id="controls">
<button onclick="prev()">←</button>
<button onclick="next()">→</button>
</div>

<script>
const photos = [
"photo_2026-05-04_10-17-11.jpg",
"photo_2026-05-04_10-17-10.jpg",
"photo_2026-05-04_10-17-09.jpg",
"photo_2026-05-04_10-17-08.jpg"
];

let i = 0;

function openBook(){
document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";
document.getElementById("controls").style.display="block";
show();
}

function show(){
document.getElementById("photo").src = photos[i];
}

function next(){
if(i < photos.length-1){ i++; show(); }
}

function prev(){
if(i > 0){ i--; show(); }
}
</script>

</body>
</html>
