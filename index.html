<title>Саше ❤️</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
text-align:center;
color:white;
}

/* экран */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:70px;
}

/* обложка */
.cover{
width:260px;
height:360px;
background:linear-gradient(135deg,#6b1f3a,#d85b8a);
margin:30px auto;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
cursor:pointer;
border-radius:15px;
box-shadow:0 20px 50px rgba(0,0,0,0.4);
}

/* книга */
.book{
display:none;
width:320px;
height:420px;
margin:auto;
background:#fdf1d3;
border-radius:10px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,0.5);
border:8px solid #e0c097;
}

/* фото */
.book img{
width:100%;
height:100%;
object-fit:cover;
border-radius:6px;
}

/* кнопки */
.controls{
display:none;
margin-top:20px;
}

button{
padding:10px 20px;
font-size:18px;
margin:10px;
cursor:pointer;
border:none;
border-radius:10px;
background:#ff4d6d;
color:white;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

function openBook(){
document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";
document.getElementById("controls").style.display="block";

}

function show(){
document.getElementById("photo").src = photos[index];
}

function next(){
if(index < photos.length-1){

show();
}
}

function prev(){

index--;

}
