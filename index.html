<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>С днём рождения, Сашулька 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  overflow-x:hidden;
  font-family:"Comfortaa",sans-serif;
  color:#4d3b4a;
  background:
    radial-gradient(circle at 20% 10%, rgba(255,255,255,.9), transparent 30%),
    radial-gradient(circle at 80% 20%, rgba(255,180,240,.4), transparent 35%),
    radial-gradient(circle at 50% 90%, rgba(150,220,255,.3), transparent 40%),
    linear-gradient(135deg,#cde9ff 0%,#ffe0f6 50%,#d9f0ff 100%);
}

/* сердечки */
.fall{
  position:fixed;
  top:-40px;
  pointer-events:none;
  z-index:20;
  opacity:.7;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(110vh) rotate(360deg)}
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
}

.hero-card{
  padding:60px;
  border-radius:40px;
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(18px);
  box-shadow:0 30px 100px rgba(120,90,150,.25);
}

.title{
  font-family:"Baloo 2",cursive;
  font-size:80px;
  background: linear-gradient(90deg,#5fd0ff,#ff6ec7,#ffc3ec);
  -webkit-background-clip:text;
  color:transparent;
}

.down-btn{
  margin-top:30px;
  width:90px;
  height:90px;
  border-radius:50%;
  border:none;
  font-size:40px;
  background:linear-gradient(135deg,#87d5ff,#ff97dd);
  color:white;
  cursor:pointer;
}

/* СЕКЦИИ */
.section{width:90%;margin:auto;padding:80px 0}

.panel{
  background:rgba(255,255,255,.4);
  padding:40px;
  border-radius:30px;
}

h2{text-align:center;font-size:40px;color:#ff72c9}

/* КНИГА */
.book-stage{display:grid;place-items:center}

#book{margin-top:20px}

/* ФОТО */
.photo-page{padding:10px}
.photo-card{
  background:white;
  padding:10px;
  border-radius:10px;
}
.photo-card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* КНОПКИ */
.controls{text-align:center;margin-top:20px}
.nav-btn{
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:linear-gradient(135deg,#6ccaff,#ff87d4);
  color:white;
  cursor:pointer;
}

.counter{margin:0 10px}
</style>
</head>

<body>

<section class="hero">
  <div class="hero-card">
    <h1 class="title">С днём рождения 💗</h1>
    <button class="down-btn" onclick="scrollDown()">💗</button>
  </div>
</section>

<section id="text" class="section">
  <div class="panel">
    <h2>Поздравление</h2>
    <div>
С днём рождения, Саша 💛  
Ты для меня очень важный человек...
    </div>
  </div>
</section>

<section class="section">
  <h2>Наша история 📖</h2>

  <div class="book-stage">
    <div id="book"></div>

    <div class="controls">
      <button class="nav-btn" onclick="prevPage()">←</button>
      <span class="counter" id="counter">1 / 1</span>
      <button class="nav-btn" onclick="nextPage()">→</button>
    </div>
  </div>
</section>

<script>
function scrollDown(){
  document.getElementById("text").scrollIntoView({behavior:"smooth"});
}

/* --- ФОТО --- */
const photos = [
"photo_2026-05-04_10-15-21.jpg",
"photo_2026-05-04_10-15-22.jpg",
"photo_2026-05-04_10-15-23.jpg"
];

/* --- ФИКС ПУТЕЙ --- */
function safePath(p){ return encodeURI(p); }

/* --- СОЗДАНИЕ СТРАНИЦ --- */
function createPage(src,i){
  const page = document.createElement("div");
  page.className="page";

  const wrap=document.createElement("div");
  wrap.className="photo-page";

  const card=document.createElement("div");
  card.className="photo-card";

  const img=document.createElement("img");
  img.src=safePath(src);

  img.onerror=()=>{
    img.src="https://via.placeholder.com/400x500?text=💗";
  }

  card.appendChild(img);
  wrap.appendChild(card);
  page.appendChild(wrap);

  return page;
}

/* --- КНИГА --- */
let pageFlip;

function initBook(){
  const book=document.getElementById("book");

  photos.forEach((p,i)=>{
    book.appendChild(createPage(p,i));
  });

  pageFlip=new St.PageFlip(book,{
    width:350,
    height:500
  });

  pageFlip.loadFromHTML(document.querySelectorAll(".page"));
  updateCounter();
}

function nextPage(){ if(pageFlip) pageFlip.flipNext(); }
function prevPage(){ if(pageFlip) pageFlip.flipPrev(); }

function updateCounter(){
  document.getElementById("counter").innerText =
    (pageFlip.getCurrentPageIndex()+1)+" / "+photos.length;
}

/* --- СЕРДЕЧКИ --- */
const symbols=["💗","💖","✨"];
for(let i=0;i<15;i++){
  const el=document.createElement("div");
  el.className="fall";
  el.innerText=symbols[Math.floor(Math.random()*symbols.length)];
  el.style.left=Math.random()*100+"vw";
  el.style.fontSize=(14+Math.random()*10)+"px";
  el.style.animationDuration=(6+Math.random()*4)+"s";
  document.body.appendChild(el);
}

/* --- СТАРТ --- */
window.onload=initBook;
</script>

</body>
</html>
