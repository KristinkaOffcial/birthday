<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Саше ❤️</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/stpageflip@2.0.7/dist/page-flip.min.css">

<style>
@import url('https://fonts.cdnfonts.com/css/bubbleboddy-neue-trial');

body{
margin:0;
background:linear-gradient(135deg,#ff6f91,#ffc75f);
font-family:'Bubbleboddy Neue Trial',sans-serif;
text-align:center;
color:white;
}

/* главный экран */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.title{
font-size:90px;
}

/* обложка */
.cover{
width:320px;
height:440px;
margin:60px auto;
background:linear-gradient(135deg,#6b1f3a,#d85b8a);
border-radius:20px;
display:flex;
justify-content:center;
align-items:center;
font-size:60px;
cursor:pointer;
box-shadow:0 30px 70px rgba(0,0,0,0.5);
transition:.4s;
}

.cover:hover{
transform:scale(1.05) rotateY(-5deg);
}

/* книга */
#book{
display:none;
margin:auto;
width:900px;
height:600px;
}

.page{
background:white;
display:flex;
justify-content:center;
align-items:center;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
}
</style>
</head>

<body>

<div class="hero">
<div class="title">С днём рождения ❤️</div>
</div>

<div class="cover" onclick="openBook()">Открыть</div>

<div id="book"></div>

<script src="https://cdn.jsdelivr.net/npm/stpageflip@2.0.7/dist/page-flip.browser.min.js"></script>

<script>

let pageFlip;

function openBook(){

document.querySelector(".cover").style.display="none";
document.getElementById("book").style.display="block";

pageFlip = new St.PageFlip(document.getElementById("book"), {
width: 450,
height: 600,
showCover: true
});

let pages = [];

/* автоматически 1–100 фото */
for(let i=1;i<=100;i++){
pages.push(`<div class="page"><img src="img/${i}.jpg"></div>`);
}

pageFlip.loadFromHTML(pages);
}
</script>

</body>
</html>
