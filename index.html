<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С днём рождения 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Comfortaa:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

<style>
body{
margin:0;
font-family:'Comfortaa',sans-serif;
background:linear-gradient(135deg,#cde7ff,#ffd6f5);
overflow-x:hidden;
}

/* экран */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.title{
font-family:'Baloo 2';
font-size:clamp(40px,8vw,90px);
background:linear-gradient(90deg,#6ec1ff,#ff8ad6);
-webkit-background-clip:text;
color:transparent;
}

.arrow{
font-size:40px;
animation:down 1.5s infinite;
text-decoration:none;
color:#ff8ad6;
}

@keyframes down{50%{transform:translateY(10px);}}

/* текст */
.section{
padding:70px 20px;
max-width:900px;
margin:auto;
}

h2{
text-align:center;
font-family:'Baloo 2';
color:#ff8ad6;
}

.text{
white-space:pre-line;
line-height:1.9;
color:#444;
}

/* книга */
.book-cover{
width:340px;
height:460px;
margin:auto;
background:linear-gradient(135deg,#6ec1ff,#ff8ad6);
border-radius:18px;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 25px 60px rgba(0,0,0,.25);
cursor:pointer;
transition:.5s;
}

.book-cover:hover{transform:scale(1.05);}

#book{
display:none;
margin:auto;
}

/* страницы */
.page{
background:#fff;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
}

/* кнопки */
.controls{
text-align:center;
margin-top:10px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
cursor:pointer;
background:#ff8ad6;
color:white;
}

/* 💗 СЕРДЦА + КОНФЕТТИ */
.fall{
position:fixed;
top:-20px;
pointer-events:none;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}
</style>

</head>

<body>

<div class="hero">
<div class="title">💗 С днём рождения, Сашулька 💙</div>
<a href="#text" class="arrow">💗</a>
</div>

<div id="text" class="section">
<h2>💗 Поздравление 💙</h2>
<div class="text">
💗 С днём рождения, Саша 💙
Я даже не знаю, с чего начать, потому что ты — это огромная часть моей жизни...

(оставь свой полный текст тут как есть, он уже работает)

</div>
</div>

<div class="section">
<h2>💗 Наша история 💙</h2>

<div class="book-cover" onclick="openBook()">
<h3>💗 Наша история 💙</h3>
<p>нажми чтобы открыть</p>
</div>

<div id="book"></div>

<div class="controls">
<button onclick="prev()">←</button>
<button onclick="next()">→</button>
</div>

</div>

<script>

/* список фото — оставь свой */
const photos = [
"photo_2026-05-04_10-15-21.jpg",
"photo_2026-05-04_10-15-22.jpg"
];

let pageFlip;

function openBook(){
document.querySelector(".book-cover").style.display="none";
const book=document.getElementById("book");
book.style.display="block";

photos.forEach(p=>{
const page=document.createElement("div");
page.className="page";

const img=document.createElement("img");
img.src=p;
img.loading="lazy";

page.appendChild(img);
book.appendChild(page);
});

pageFlip=new St.PageFlip(book,{width:350,height:500});
pageFlip.loadFromHTML(document.querySelectorAll(".page"));
}

function next(){if(pageFlip)pageFlip.flipNext();}
function prev(){if(pageFlip)pageFlip.flipPrev();}

/* 💗 СЕРДЦА + КОНФЕТТИ */
const symbols = ["💗","💙","💖","✨","💘"];

for(let i=0;i<60;i++){
let el=document.createElement("div");
el.className="fall";
el.innerText=symbols[Math.floor(Math.random()*symbols.length)];

el.style.left=Math.random()*100+"vw";
el.style.fontSize=(20+Math.random()*25)+"px";
el.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(el);
}
</script>

</body>
</html>
